# HERMES-Modell — einzige Quelle für den HERMES Explorer und die Referenzen des HERMES-Skills.
# Pflege: Ergebnisse unter «ergebnisse» ergänzen oder ändern, danach `python scripts/validate.py` und
# `python scripts/build_skill_refs.py` ausführen. Schema siehe README.md.

schema_version: 1
methode: HERMES 2022
ausgabe: "Referenzhandbuch Projektmanagement, Ausgabe März 2026"

quellen:
  - "Ergebnisse, Module, Phasen und Abhängigkeiten mit Basis «phasenmodell»: Übersichtsgrafik «HERMES-Phasenmodell für klassische und agile Projekte». Sammelpfeile der Grafik sind als Einzelabhängigkeiten abgebildet."
  - "Zweck und Gliederung mit zweck_quelle «referenz»: HERMES-Skill-Referenz dokumente.md. Übrige Zweckangaben sind sinngemässe Kurzbeschriebe."
  - "Szenario-Zuordnung der Module: Modulmatrix aus szenarien_rollen.md. Sizing und Tailoring sind nicht abgebildet."
  - "Wissensobjekte und Lese-/Schreibrollen: Knowledge-Schema v0.4 der Generierungspipeline."
  - "Abhängigkeiten mit Basis «pipeline» sind Designentscheidungen der Generierungspipeline, nicht Teil von HERMES."

phasen:
  - {id: initialisierung, name: Initialisierung}
  - {id: konzept, name: Konzept}
  - {id: realisierung, name: Realisierung}
  - {id: einfuehrung, name: Einführung}
  - {id: abschluss, name: Abschluss}
  - {id: phasenunabhaengig, name: Phasenunabhängig}
agil:
  umsetzung: {name: "Umsetzung (agil)", ersetzt: [konzept, realisierung, einfuehrung]}

szenarien:
  - {id: it_entwicklung, name: "IT-Entwicklung"}
  - {id: it_adaption, name: "IT-Adaption"}
  - {id: dlp_entwicklung, name: "Dienstleistung/Produkt Entwicklung"}
  - {id: dlp_adaption, name: "Dienstleistung/Produkt Adaption"}
  - {id: organisationsanpassung, name: "Organisationsanpassung"}

module:
  - id: projektsteuerung
    name: "Projektsteuerung · Projektführung"
    szenarien: [it_entwicklung, it_adaption, dlp_entwicklung, dlp_adaption, organisationsanpassung]
  - id: projektgrundlagen
    name: "Projektgrundlagen"
    szenarien: [it_entwicklung, it_adaption, dlp_entwicklung, dlp_adaption, organisationsanpassung]
  - id: organisation
    name: "Organisation"
    szenarien: [it_entwicklung, it_adaption, dlp_entwicklung, dlp_adaption, organisationsanpassung]
  - id: produkt
    name: "Produkt"
    szenarien: [dlp_entwicklung, dlp_adaption]
  - id: it_system
    name: "IT-System"
    szenarien: [it_entwicklung, it_adaption]
  - id: beschaffung
    name: "Beschaffung"
    szenarien: [it_entwicklung, it_adaption, dlp_entwicklung, dlp_adaption, organisationsanpassung]
  - id: testen
    name: "Testen"
    szenarien: [it_entwicklung, it_adaption, dlp_entwicklung, dlp_adaption]
  - id: einfuehrungsorganisation
    name: "Einführungsorganisation"
    szenarien: [it_entwicklung, it_adaption, dlp_entwicklung, dlp_adaption, organisationsanpassung]
  - id: it_migration
    name: "IT-Migration"
    szenarien: [it_entwicklung, it_adaption]
  - id: it_betrieb
    name: "IT-Betrieb"
    szenarien: [it_entwicklung, it_adaption]
  - id: isds
    name: "ISDS"
    szenarien: [it_entwicklung, it_adaption]

phasentore:
  - {entscheid: Projektinitialisierungsfreigabe, ergebnis: projektinitialisierungsauftrag, gilt_ab: initialisierung}
  - {entscheid: Durchführungsfreigabe, ergebnis: durchfuehrungsauftrag, gilt_ab: konzept}

pipeline_status:
  prototyp: "Prototyp"
  naechste_session: "Nächste Session"
  geplant: "Geplant"
  roadmap: "Roadmap"

wissensobjekte:
  - {id: stakeholder, name: "Stakeholder & Rollen", gruppe: "Kern", querschnitt: true}
  - {id: phase_execution, name: "Termine & Meilensteine", gruppe: "Kern"}
  - {id: kosten, name: "Kosten & Budget", gruppe: "Kern", hinweis: "Im Knowledge-Schema v0.4 noch nicht als eigener Typ definiert."}
  - {id: ausgangslage, name: "Ausgangslage", gruppe: "Geschäftskontext", querschnitt: true}
  - {id: ziel, name: "Ziele", gruppe: "Geschäftskontext"}
  - {id: rahmenbedingung, name: "Rahmenbedingungen", gruppe: "Geschäftskontext"}
  - {id: anforderung, name: "Anforderungen", gruppe: "Geschäftskontext"}
  - {id: loesungsvariante, name: "Lösungsvariante & Szenario", gruppe: "Geschäftskontext"}
  - {id: entscheid, name: "Entscheide", gruppe: "Geschäftskontext"}
  - {id: rechtl_grundlage, name: "Rechtliche Grundlagen", gruppe: "Geschäftskontext"}
  - {id: beschaffungsgegenstand, name: "Beschaffungsgegenstand", gruppe: "Beschaffung"}
  - {id: anbieter, name: "Anbieter", gruppe: "Beschaffung"}
  - {id: zuschlag, name: "Zuschlag", gruppe: "Beschaffung"}
  - {id: vertrag, name: "Vertrag", gruppe: "Beschaffung"}
  - {id: systemkomponente, name: "Systemkomponenten", gruppe: "Technik"}
  - {id: schnittstelle, name: "Schnittstellen", gruppe: "Technik"}
  - {id: datenkategorie, name: "Datenkategorien", gruppe: "Technik"}
  - {id: benutzergruppe, name: "Benutzergruppen & Organisation", gruppe: "Technik"}
  - {id: betriebsumgebung, name: "Betriebsumgebung", gruppe: "Technik"}
  - {id: technische_anforderung, name: "Technische Anforderungen", gruppe: "Technik"}
  - {id: supportprozess, name: "Support & Service Levels", gruppe: "Betrieb & Einführung"}
  - {id: backup_konzept, name: "Backup & Recovery", gruppe: "Betrieb & Einführung"}
  - {id: berechtigungsrolle, name: "Berechtigungsrollen", gruppe: "Betrieb & Einführung"}
  - {id: testfall, name: "Testfälle", gruppe: "Betrieb & Einführung"}
  - {id: migrationsschritt, name: "Migrationsschritte", gruppe: "Betrieb & Einführung"}
  - {id: schulungseinheit, name: "Schulungseinheiten", gruppe: "Betrieb & Einführung"}
  - {id: risiko, name: "Risiken", gruppe: "Risiko & Compliance", querschnitt: true}
  - {id: datenschutz_anforderung, name: "Datenschutzanforderungen", gruppe: "Risiko & Compliance"}
  - {id: sicherheitsanforderung, name: "Sicherheitsanforderungen", gruppe: "Risiko & Compliance"}
  - {id: offener_punkt, name: "Offene Punkte & Pendenzen", gruppe: "Risiko & Compliance", querschnitt: true}
  - {id: erfahrung, name: "Projekterfahrungen", gruppe: "Risiko & Compliance"}

ergebnisse:

  # ---------- Initialisierung ----------
  - id: projektinitialisierungsauftrag
    name: "Projektinitialisierungsauftrag"
    kurz: PIA
    typ: dokument
    herkunft: hermes
    phase: initialisierung
    module: [projektsteuerung]
    entscheid: "Projektinitialisierungsfreigabe"
    pipeline_status: prototyp
    zweck: "Verbindliche Grundlage für die Freigabe der Phase Initialisierung. Vereinbarung zwischen Auftraggeber und Projektleiter für diese Phase."
    zweck_quelle: referenz
    gliederung:
      - "Ausgangslage"
      - "Ziele der Phase Initialisierung"
      - "Rahmenbedingungen"
      - "Ressourcenbedarf (Personalaufwand, Sachmittel, Kosten)"
      - "Termine"
      - "Projektorganisation und Personal"
      - "Kommunikation"
      - "Risiken"
    wissen:
      schreibt: [ausgangslage, rahmenbedingung, stakeholder, phase_execution, kosten, risiko]
  - id: stakeholderliste
    name: "Stakeholderliste"
    typ: dokument
    herkunft: hermes
    phase: initialisierung
    module: [projektsteuerung]
    zweck: "Grundlage für das Managen der Stakeholder und die Kommunikationsplanung. Wird im Projektverlauf kontinuierlich weitergeführt."
    zweck_quelle: referenz
    hinweis: "Im Phasenmodell zusätzlich als phasenunabhängiges Ergebnis geführt."
    gliederung:
      - "Stakeholder (Name, Funktion, Organisation, Kontakt, Rolle im Projekt, Einfluss, Interesse)"
    wissen:
      ergaenzt: [stakeholder]
      liest: [ausgangslage]
    voraussetzungen:
      - {id: projektinitialisierungsauftrag, basis: phasenmodell}
  - id: rechtsgrundlagenanalyse
    name: "Rechtsgrundlagenanalyse"
    typ: dokument
    herkunft: hermes
    phase: initialisierung
    module: [projektgrundlagen]
    zweck: "Klärt die für das Vorhaben massgebenden rechtlichen Grundlagen."
    zweck_quelle: sinngemaess
    wissen:
      schreibt: [rechtl_grundlage]
      liest: [ausgangslage, rahmenbedingung]
    voraussetzungen:
      - {id: stakeholderliste, basis: phasenmodell}
  - id: studie
    name: "Studie"
    typ: dokument
    herkunft: hermes
    phase: initialisierung
    module: [projektgrundlagen]
    entscheid: "Weiteres Vorgehen"
    pipeline_status: geplant
    zweck: "Beschreibt die angestrebte Lösung, bewertet Lösungsvarianten und entspricht dem Business-Case. Grundlage für den Entscheid «Weiteres Vorgehen»."
    zweck_quelle: referenz
    gliederung:
      - "Ausgangslage"
      - "Standortbestimmung aus geschäftlicher Sicht"
      - "Analyse und Bewertung (Ziele, Rahmenbedingungen, Grobanforderungen)"
      - "Lösungsvarianten"
      - "Vorschlag und Entscheid weiteres Vorgehen (Variante, Szenario, Vorgehensweise)"
      - "Planung und Termine"
    wissen:
      schreibt: [ziel, loesungsvariante, anforderung, systemkomponente, entscheid]
      ergaenzt: [ausgangslage, rahmenbedingung, kosten, risiko, phase_execution, datenkategorie]
      liest: [stakeholder, rechtl_grundlage]
    voraussetzungen:
      - {id: stakeholderliste, basis: phasenmodell}
      - {id: rechtsgrundlagenanalyse, basis: phasenmodell}
      - {id: schutzbedarfsanalyse, basis: phasenmodell}
  - id: schutzbedarfsanalyse
    name: "Schutzbedarfsanalyse"
    typ: dokument
    herkunft: hermes
    phase: initialisierung
    module: [projektgrundlagen]
    zweck: "Erhebt den Schutzbedarf der Informationen und Daten des Vorhabens."
    zweck_quelle: sinngemaess
    wissen:
      schreibt: [datenkategorie]
      ergaenzt: [risiko]
      liest: [ausgangslage, rechtl_grundlage]
    voraussetzungen:
      - {id: stakeholderliste, basis: phasenmodell}
  - id: beschaffungsanalyse
    name: "Beschaffungsanalyse"
    typ: dokument
    herkunft: hermes
    phase: initialisierung
    module: [projektgrundlagen]
    pipeline_status: roadmap
    zweck: "Beschreibt Handlungsbedarf, Marktanalyse und Beschaffungsverfahren. Ergänzt die Studie als Grundlage für die Entscheidung zur Projektfortsetzung."
    zweck_quelle: referenz
    gliederung:
      - "Grund für die Beschaffung / Handlungsbedarf"
      - "Beschaffungsinhalte"
      - "Anbieter und Lieferanten"
      - "Rollen und Verantwortung"
      - "Terminliche Aspekte"
      - "Finanzielle Aspekte / Vorkalkulation"
      - "Beschaffungsrechtliche Aspekte"
      - "Beschaffungsplan"
      - "Ausschreibungsverfahren"
      - "Vorgehen bei Fragen zur Ausschreibung"
    wissen:
      schreibt: [beschaffungsgegenstand, anbieter]
      ergaenzt: [kosten, phase_execution]
      liest: [ausgangslage, stakeholder, rechtl_grundlage]
    voraussetzungen:
      - {id: stakeholderliste, basis: phasenmodell}
  - id: projektmanagementplan
    name: "Projektmanagementplan"
    typ: dokument
    herkunft: hermes
    phase: initialisierung
    module: [projektsteuerung]
    zweck: "Gesamtplanung des Projekts inkl. Regelungen zu Methoden, Rollen und Hilfsmitteln. Erste Version in der Initialisierung, danach phasenunabhängig nachgeführt."
    zweck_quelle: referenz
    gliederung:
      - "Projektbeschreibung"
      - "Durchführungsorganisation"
      - "Projektergebnisstruktur"
      - "Qualitätsziele und -vorgaben"
      - "Prüfplan (QS)"
      - "Durchführungsplanung (Termine, Releases, Kosten, Ressourcen, Beschaffung, Kommunikation, Reporting, Stakeholder)"
      - "Vorgaben, Methoden und Werkzeuge"
    wissen:
      ergaenzt: [stakeholder, phase_execution, kosten]
      liest: [ausgangslage, ziel, loesungsvariante, rahmenbedingung]
    voraussetzungen:
      - {id: studie, basis: phasenmodell}
      - {id: beschaffungsanalyse, basis: phasenmodell}
  - id: durchfuehrungsauftrag
    name: "Durchführungsauftrag"
    kurz: DA
    typ: dokument
    herkunft: hermes
    phase: initialisierung
    module: [projektsteuerung]
    entscheid: "Durchführungsfreigabe"
    pipeline_status: roadmap
    zweck: "Rahmen und verbindliche Grundlage für die Lösungsentstehung. Autorisiert die Projektfortsetzung; Vereinbarung zwischen Auftraggeber und Projektleiter."
    zweck_quelle: referenz
    gliederung:
      - "Ausgangslage und Handlungsbedarf"
      - "Ziele (Lösungs- und Projektvorgehensziele)"
      - "Rahmenbedingungen, Strategiebezug und Abgrenzungen"
      - "Zusammenfassende Lösungsbeschreibung"
      - "Rechtliche Grundlagen"
      - "Investitionsbedarf"
      - "Ressourcen- und Hilfsmittelbedarf"
      - "Kosten/Nutzen/Wirtschaftlichkeit (Vorschau)"
      - "Planung und Organisation"
      - "Risiken"
      - "Konsequenzen"
      - "Verbindlichkeiten"
    wissen:
      schreibt: [entscheid]
      ergaenzt: [ziel, kosten, risiko, rechtl_grundlage]
      liest: [ausgangslage, stakeholder, loesungsvariante, rahmenbedingung, anforderung, phase_execution]
    voraussetzungen:
      - {id: projektmanagementplan, basis: phasenmodell}

  # ---------- Konzept ----------
  - id: situationsanalyse
    name: "Situationsanalyse"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [organisation, produkt, it_system]
    zweck: "Beschreibt und analysiert die gegenwärtige Situation. Bildet die fachliche Basis für Lösungs- und Organisationsanforderungen; ziel- und lösungsneutral."
    zweck_quelle: referenz
    hinweis: "Erscheint im Phasenmodell in den Modulen Organisation, Produkt und IT-System."
    gliederung:
      - "Ausgangslage"
      - "Ist-Organisation"
      - "Beschreibung der bestehenden Lösung (Ist-System / Ist-Produkt)"
      - "Beschreibung des Ist-Gesamtkontexts"
      - "Stärken- und Schwächenanalyse"
      - "Fazit und Handlungsbedarf"
    wissen:
      schreibt: [schnittstelle, benutzergruppe]
      ergaenzt: [ausgangslage, systemkomponente, kosten]
      liest: [stakeholder, ziel]
  - id: organisationsanforderungen
    name: "Organisationsanforderungen"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [organisation]
    zweck: "Anforderungen an die künftige Organisation, abgeleitet aus der Situationsanalyse."
    zweck_quelle: sinngemaess
    wissen:
      ergaenzt: [anforderung, benutzergruppe]
      liest: [ziel, ausgangslage]
    voraussetzungen:
      - {id: situationsanalyse, basis: phasenmodell}
  - id: organisationskonzept
    name: "Organisationskonzept"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [organisation]
    zweck: "Beschreibt die künftige Organisation, die mit der Lösung eingeführt wird."
    zweck_quelle: sinngemaess
    wissen:
      ergaenzt: [benutzergruppe]
      liest: [anforderung, ziel]
    voraussetzungen:
      - {id: organisationsanforderungen, basis: phasenmodell}
  - id: geschaeftsmodellbeschreibung
    name: "Geschäftsmodellbeschreibung"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [organisation]
    zweck: "Beschreibt das künftige Geschäftsmodell der betroffenen Organisation."
    zweck_quelle: sinngemaess
    wissen:
      liest: [ziel, anforderung, benutzergruppe]
    voraussetzungen:
      - {id: organisationskonzept, basis: phasenmodell}
  - id: prozessbeschreibung
    name: "Prozessbeschreibung"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [organisation]
    zweck: "Beschreibt die künftigen Abläufe und Geschäftsprozesse."
    zweck_quelle: sinngemaess
    hinweis: "Wird in der Realisierung nachgeführt."
    wissen:
      ergaenzt: [benutzergruppe]
      liest: [anforderung]
    voraussetzungen:
      - {id: geschaeftsmodellbeschreibung, basis: phasenmodell}
  - id: organisationsbeschreibung
    name: "Organisationsbeschreibung"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [organisation]
    zweck: "Beschreibt die künftige Aufbauorganisation mit Stellen und Rollen."
    zweck_quelle: sinngemaess
    hinweis: "Wird in der Realisierung nachgeführt."
    wissen:
      ergaenzt: [benutzergruppe, stakeholder]
      liest: [anforderung]
    voraussetzungen:
      - {id: geschaeftsmodellbeschreibung, basis: phasenmodell}
  - id: loesungsanforderungen
    name: "Lösungsanforderungen"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [produkt, it_system]
    zweck: "Sämtliche fachlichen, technischen, rechtlichen und regulatorischen Anforderungen an das künftige System oder Produkt."
    zweck_quelle: referenz
    hinweis: "Erscheint in den Modulen Produkt und IT-System und speist die Konzepte der übrigen Module."
    gliederung:
      - "Grobanforderungen"
      - "Anforderungskatalog"
      - "Detaillierte Lösungsanforderungen"
    wissen:
      ergaenzt: [anforderung]
      liest: [ziel, loesungsvariante, systemkomponente, schnittstelle, benutzergruppe, rechtl_grundlage]
    voraussetzungen:
      - {id: situationsanalyse, basis: phasenmodell}
  - id: produktkonzept
    name: "Produktkonzept"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [produkt]
    entscheid: "Produktkonzept"
    zweck: "Beschreibt das künftige Produkt bzw. die Dienstleistung; wird iterativ bis zur Realisierung verfeinert."
    zweck_quelle: sinngemaess
    wissen:
      schreibt: [entscheid]
      liest: [anforderung, ziel, benutzergruppe]
    voraussetzungen:
      - {id: loesungsanforderungen, basis: phasenmodell}
  - id: systemkonzept
    name: "Systemkonzept"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [it_system]
    zweck: "Beschreibt das künftige IT-System auf konzeptioneller Ebene; wird iterativ bis zur Realisierung verfeinert."
    zweck_quelle: sinngemaess
    wissen:
      ergaenzt: [systemkomponente, schnittstelle]
      liest: [anforderung, loesungsvariante]
    voraussetzungen:
      - {id: loesungsanforderungen, basis: phasenmodell}
  - id: loesungsarchitektur
    name: "Lösungsarchitektur"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [it_system]
    entscheid: "Lösungsarchitektur"
    pipeline_status: roadmap
    zweck: "Beschreibt die Architektur der Lösung und ihre Einbettung in die bestehende Umgebung."
    zweck_quelle: sinngemaess
    wissen:
      schreibt: [betriebsumgebung, technische_anforderung, entscheid]
      ergaenzt: [systemkomponente, schnittstelle]
      liest: [anforderung, loesungsvariante, rahmenbedingung]
    voraussetzungen:
      - {id: systemkonzept, basis: phasenmodell}
  - id: integrationskonzept
    name: "Integrationskonzept"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [it_system]
    zweck: "Beschreibt die Integration der Lösung in die bestehende Systemlandschaft."
    zweck_quelle: sinngemaess
    wissen:
      ergaenzt: [schnittstelle]
      liest: [systemkomponente, betriebsumgebung]
    voraussetzungen:
      - {id: loesungsarchitektur, basis: phasenmodell}
      - {id: loesungsanforderungen, basis: phasenmodell}
  - id: ausschreibungsunterlagen
    name: "Ausschreibungsunterlagen"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [beschaffung]
    entscheid: "Ausschreibung"
    pipeline_status: roadmap
    zweck: "Alle Informationen, die im Rahmen einer Ausschreibung publiziert werden, inkl. Lastenheft mit Kriterienkatalog."
    zweck_quelle: referenz
    gliederung:
      - "Lastenheft (Ausgangslage, Situationsbeschreibung, Soll-Zustand)"
      - "Kriterienkatalog (Eignungs- und Zuschlagskriterien, Gewichtung und Punkte)"
      - "Anhänge (AGB, Vertragsentwurf, Ausschreibungstext, weitere Unterlagen)"
    wissen:
      ergaenzt: [anforderung, beschaffungsgegenstand]
      liest: [ausgangslage, systemkomponente, kosten, phase_execution, rechtl_grundlage, loesungsvariante]
    voraussetzungen:
      - {id: loesungsanforderungen, basis: phasenmodell}
      - {id: organisationsanforderungen, basis: phasenmodell}
      - {id: beschaffungsanalyse, basis: pipeline}
  - id: evaluationsbericht
    name: "Evaluationsbericht"
    typ: dokument
    herkunft: hermes
    phase: konzept
    module: [beschaffung]
    entscheid: "Zuschlag"
    pipeline_status: roadmap
    zweck: "Fasst die Ergebnisse der Angebotsbewertung zusammen. Grundlage für den Entscheid Zuschlag."
    zweck_quelle: referenz
    gliederung:
      - "Ausgangslage"
      - "Vorgehen bei der Evaluation"
      - "Ergebnisse der Evaluation"
      - "Empfehlung"
      - "Anträge"
      - "Unterschriften"
      - "Anhänge"
    wissen:
