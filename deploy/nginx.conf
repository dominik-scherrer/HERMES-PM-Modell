server {
    listen 80;
    root /usr/share/nginx/html;

    # Modell immer frisch laden, damit Änderungen nach einem Deploy sofort sichtbar sind
    location = /hermes.yaml {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }
}
